name: Deploy

# Deploys main to production with Kamal (config/deploy.yml) once CI is
# green on the pushed commit. Can also be run by hand from the Actions tab.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

# One deploy at a time; a newer one queues behind a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push/pull ghcr.io image with GITHUB_TOKEN

jobs:
  deploy:
    name: Kamal deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scorekeepr.kjeldahl.it
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # CI runs can finish out of order; never roll main back to an older commit.
      - name: Skip if superseded
        id: latest
        if: github.event_name == 'workflow_run'
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "main is at $head, not $DEPLOY_SHA - skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.latest.outputs.skip != 'true'
        with:
          bundler-cache: true

      - uses: webfactory/ssh-agent@v0.9.1
        if: steps.latest.outputs.skip != 'true'
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # The committed .kamal/secrets pulls from 1Password via `op`; on CI the
      # values come from GitHub secrets instead. Kamal builds from a git clone,
      # so this working-tree change doesn't taint the image version.
      - name: Write CI secrets
        if: steps.latest.outputs.skip != 'true'
        run: |
          cat > .kamal/secrets <<'EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          RAILS_MASTER_KEY=$RAILS_MASTER_KEY
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          EVENT_STORE_PASSWORD=$POSTGRES_PASSWORD
          EOF

      - name: Deploy
        if: steps.latest.outputs.skip != 'true'
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: bin/kamal deploy
