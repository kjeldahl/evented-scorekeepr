name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & security
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Rubocop
        run: bin/rubocop -f github
      - name: Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: Bundler audit
        run: bin/bundler-audit
      - name: Packwerk (slice boundaries)
        run: bundle exec packwerk check
      - name: Zeitwerk
        run: bin/rails zeitwerk:check

  test:
    name: Tests (${{ matrix.adapter }} store)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        adapter: [ memory, postgres ]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scorekeepr
          POSTGRES_PASSWORD: scorekeepr
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      EVENT_STORE_ADAPTER: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare event store
        if: matrix.adapter == 'postgres'
        run: bin/rails event_store:prepare
      - name: RSpec
        run: bundle exec rspec
      - name: Cucumber
        run: bundle exec cucumber --publish-quiet
      # RSpec + Cucumber merge into one coverage/ result (config/coverage.rb).
      # Memory leg, so the PR's base-branch run below needs no postgres.
      - name: Upload coverage report
        if: always() && matrix.adapter == 'memory'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 30

  coverage-report:
    name: Coverage report
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    env:
      RAILS_ENV: test
      EVENT_STORE_ADAPTER: memory
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage-pr/

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate base branch coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}
          bundle install
          bundle exec rspec || true
          bundle exec cucumber --publish-quiet || true
          cp coverage/coverage.json /tmp/base_coverage.json || true

      - name: Checkout back to PR
        if: github.event_name == 'pull_request'
        run: git checkout ${{ github.sha }}

      - name: Generate coverage change report
        run: |
          if [ -f /tmp/base_coverage.json ] && [ -f coverage-pr/coverage.json ]; then
            ruby script/coverage_report.rb /tmp/base_coverage.json coverage-pr/coverage.json > coverage_summary.md
          else
            ruby script/coverage_report.rb coverage-pr/coverage.json > coverage_summary.md
          fi
          cat coverage_summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage_summary.md

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage_summary.md
          retention-days: 30

  quality:
    name: CRAP & duplication
    runs-on: ubuntu-26.04
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: crap4r (CRAP <= 8)
        run: bundle exec crap4r app/slices lib
      - name: dry4r (duplicate code report)
        run: bundle exec dry4r

  # Production deploys live in a private repo: a green push to main asks it
  # to deploy this commit (repository_dispatch).
  notify-deploy:
    name: Notify deploy
    needs: [ lint, test, coverage-report, quality, mutant ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Dispatch deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh api "repos/kjeldahl/scorekeepr-deploy/dispatches" \
            -f event_type=deploy -f "client_payload[sha]=$GITHUB_SHA"

  mutant:
    name: Mutant (incremental)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # PRs: subjects touched since the base branch. Pushes: since the previous
      # head (falls back to the full suite when that commit is unknown).
      - name: Mutant
        env:
          SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bin/rails quality:mutant
