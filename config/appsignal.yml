default: &defaults
  active: true
  name: "Scorekeepr"
  # push_api_key comes from APPSIGNAL_PUSH_API_KEY (Kamal secret in production).

development:
  <<: *defaults
  active: false

test:
  <<: *defaults
  active: false

production:
  <<: *defaults
  # Kamal sets KAMAL_VERSION (git SHA) in the app container; a new revision
  # makes AppSignal create a deploy marker automatically.
  revision: <%= ENV["KAMAL_VERSION"] %>
