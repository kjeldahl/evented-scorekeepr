---
usage: opensource
integration:
  name: rspec
requires:
  - ./config/environment
# Zeitwerk lazy-loads in test; mutant needs the domain constants defined to
# match subjects. config/environments/test.rb eager-loads when CI is set.
environment_variables:
  RAILS_ENV: test # mutant requires config/environment itself, before rails_helper sets this
  CI: "1"
# Tests run against the in-memory event store (config/event_store.yml), so
# every mutant worker has its own isolated store and workers can run in
# parallel. If you force EVENT_STORE_ADAPTER=postgres, drop jobs back to 1 —
# the suite would share (and drop/recreate) one Postgres events table.
jobs: 4
matcher:
  subjects:
    - Identity*
    - Accounts*
    - Leagues*
    - Matches*
    - Scoreboards*
    - Statistics*
    # Root-owned audit infrastructure (lib/impersonation_audit.rb). Unlike the
    # thin EventStore/Result plumbing, it carries real, security-sensitive
    # decision logic (what is auditable, guard clauses, event construction), so
    # it earns the same 100% mutation bar as slice domain code. Covered by
    # spec/lib/impersonation_audit_spec.rb (rspec, mutant's kill signal).
    - ImpersonationAudit*
    # Root-owned impersonation session teardown (lib/impersonation_session.rb):
    # owns ImpersonationEnded, reached by both the accounts escape button and
    # identity sign-out. Real event-construction logic, so same 100% bar.
    # Covered by spec/lib/impersonation_session_spec.rb.
    - ImpersonationSession*
  ignore:
    # Mutant covers slice DOMAIN code only. Controllers (app/slices/*/web)
    # are exercised through Cucumber, not the rspec suite mutant runs, so
    # mutating them is not wired to a kill signal — exclude every controller.
    - Identity::ProfilesController*
    - Identity::RegistrationsController*
    - Identity::SessionsController*
    - Identity::SuperAdminHandoffsController*
    - Accounts::AccountLeavingsController*
    - Accounts::AccountsController*
    - Accounts::BaseController*
    - Accounts::DashboardController*
    - Accounts::InvitationAcceptancesController*
    - Accounts::InvitationDeclinesController*
    - Accounts::InvitationRevocationsController*
    - Accounts::InvitationsController*
    - Accounts::ImpersonationsController*
    - Accounts::OnBehalfAcceptancesController*
    - Accounts::PendingInvitationsController*
    - Leagues::BaseController*
    - Leagues::LeaguesController*
    - Matches::BaseController*
    - Matches::MatchesController*
    - Scoreboards::BaseController*
    - Scoreboards::ScoreboardsController*
    - Scoreboards::TvController*
    # The TV channel is web/ too (the same view-only gate as TvController,
    # behind ActionCable) — exercised by channel specs and Cucumber, not a
    # mutant kill signal.
    - Scoreboards::TvChannel*
    - Statistics::BaseController*
    - Statistics::PlayersController*
